<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELMOR</title>
<style>
:root{--bg:#f6f5f3;--sf:#ebe9e5;--tx:#1b1b1f;--mu:#6d6f76;--ac:#a3243b;--bd:#d9d6d0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--sf:#181a1f;--tx:#e6e7ea;--mu:#8b8f98;--ac:#d04460;--bd:#262930;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f12;--sf:#181a1f;--tx:#e6e7ea;--mu:#8b8f98;--ac:#d04460;--bd:#262930;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;height:100%}
#side{width:270px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:8px;flex-shrink:0}
#new{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:left}
#new:hover,.ci:hover{background:var(--bg)}
#list{flex:1;overflow-y:auto}
.ci{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:15px}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci.on{background:var(--bg);border-left:2px solid var(--ac)}
.ci button{color:var(--mu);padding:0 6px}
.foot{display:flex;gap:6px;font-size:14px;color:var(--mu)}.foot button{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
#menu{display:none;font-size:20px}#ttl{flex:1;font-weight:600;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:18px 14px;scroll-behavior:smooth}
.m{max-width:760px;margin:0 auto 18px;display:flex;gap:10px}
.m.u{justify-content:flex-end}.m.u .b{background:var(--sf);padding:9px 14px;border-radius:18px;max-width:85%;word-break:break-word}
.av{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:2px}
.m.a .b{flex:1;min-width:0;word-break:break-word}
pre{background:var(--sf);padding:12px;border-radius:10px;overflow-x:auto;font-size:14px}code{background:var(--sf);padding:1px 5px;border-radius:5px;font-size:.92em}pre code{padding:0;background:none}
.empty{max-width:520px;margin:12vh auto 0;text-align:center}.empty h1{letter-spacing:.3em;margin:0 0 6px}.empty p{color:var(--mu);margin:0 0 20px}
.chip{display:block;width:100%;border:1px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:8px}.chip:hover{border-color:var(--ac)}
#comp{padding:8px 14px 12px}.row{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:6px 6px 6px 16px}
textarea{flex:1;background:none;border:0;outline:0;resize:none;font:inherit;color:inherit;max-height:160px;padding:7px 0}
#go{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;font-size:18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;max-width:90%;display:none;z-index:9}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:420px;width:92%;max-height:80%}
dialog li{display:flex;gap:8px;font-size:14px;padding:3px 0}dialog ul{padding:0;list-style:none}
#ov{display:none}
@keyframes g{0%,100%{transform:none;filter:none}20%{transform:translateX(-3px);filter:hue-rotate(60deg)}40%{transform:translateX(3px) skewX(4deg);opacity:.6}60%{transform:none;opacity:1}80%{transform:translateX(-1px);filter:blur(1px)}}
.glitch{animation:g .6s steps(5) 2}
.ghost .b{font-style:italic;color:var(--mu)}
@media(max-width:800px){#side{position:fixed;left:0;top:0;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#side.open{transform:none}#ov.open{display:block;position:fixed;inset:0;background:#0008;z-index:4}#menu{display:block}}
#ld{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center;padding:20px}.bx{max-width:420px;width:100%;text-align:center}.bx h1{letter-spacing:.3em}.bx p{color:var(--mu);font-size:14px}
#ms{width:100%;padding:10px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;margin:8px 0 14px;font:inherit}
#bar{height:6px;background:var(--sf);border-radius:3px;margin-bottom:14px;overflow:hidden}#bi{display:block;height:100%;width:0;background:var(--ac)}
</style></head><body>
<div id="app">
<aside id="side"><button id="new">＋ Новый диалог</button><div id="list"></div>
<div class="foot"><button id="memBtn">Память</button><button id="srcBtn">Источники</button><button id="wipe">Стереть всё</button></div></aside>
<div id="ov"></div>
<main><header><button id="menu" aria-label="Меню">☰</button><div id="ttl">VELMOR</div></header>
<div id="msgs"></div>
<div id="comp"><div class="row"><textarea id="inp" rows="1" placeholder="Напиши VELMOR…"></textarea><button id="go" aria-label="Отправить">↑</button></div></div></main>
</div>
<div id="ld"><div class="bx"><h1>VELMOR</h1><p id="lp">Модель работает прямо в твоём браузере. При первом запуске она скачивается один раз и кэшируется.</p><select id="ms"></select><div id="bar"><i id="bi"></i></div><button id="lb" class="chip">Запустить</button></div></div>
<div id="toast"></div><dialog id="dlg"></dialog>
<script type="module">
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='velmor_v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fresh=()=>({chats:[],active:null,mem:{facts:[],style:'',n:0},h:{total:0,last:-99,sessions:0,lastVisit:0,events:0,erased:0,typing:[]}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh();if(!S.chats)S=fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const H=S.h,prevVisit=H.lastVisit;
if(!prevVisit||Date.now()-prevVisit>18e5)H.sessions++;
H.lastVisit=Date.now();save();
let eng=null,busy=false,ctrl=null,t0=0,del=0,ghostT=null,chain=Promise.resolve();
let rid=0,CTX='';
async function run(input,o){const messages=typeof input=='string'?[{role:'user',content:input}]:input;
const js=messages.some(m=>m.content.includes('Верни ТОЛЬКО JSON')),id=++rid;
const off=api.onToken(d=>{if(d.id==id&&o.onText)o.onText({text:d.text})});
if(o.signal)o.signal.addEventListener('abort',()=>api.abort(id));
try{return{text:await api.chat({id,messages,json:js})}}finally{off()}}
function sample(i,o={}){const p=chain.then(()=>run(i,o));chain=p.catch(()=>{});return p}
const inp=$('#inp'),cur=()=>S.chats.find(c=>c.id==S.active);
function note(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>e.style.display='none',4500)}
function newChat(){const c={id:uid(),title:'Новый диалог',msgs:[],at:Date.now()};S.chats.unshift(c);S.active=c.id;save();return c}
function md(s){return s.split('```').map((p,i)=>{if(i%2){const n=p.indexOf('\n');return '<pre><code>'+esc(n>-1?p.slice(n+1):p)+'</code></pre>'}
return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,3} (.+)$/gm,'<b>$1</b>').replace(/^[-*] /gm,'• ').replace(/\n/g,'<br>')}).join('')}
function bubble(m){const d=document.createElement('div');d.className='m '+m.r+(m.g?' ghost':'');const b=document.createElement('div');b.className='b';
b.innerHTML=m.r=='a'?md(m.t||'…'):esc(m.t).replace(/\n/g,'<br>');if(m.r=='a'){const a=document.createElement('div');a.className='av';a.textContent='V';d.append(a)}d.append(b);return d}
function renderList(){const l=$('#list');l.innerHTML='';S.chats.forEach(c=>{const d=document.createElement('div');d.className='ci'+(c.id==S.active?' on':'');
const s=document.createElement('span');s.textContent=c.title;const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Удалить');
x.onclick=e=>{e.stopPropagation();if(!confirm('Удалить диалог?'))return;S.chats=S.chats.filter(k=>k.id!=c.id);if(S.active==c.id)S.active=S.chats[0]?S.chats[0].id:null;save();renderAll()};
d.onclick=()=>{S.active=c.id;save();renderAll();side(0)};d.append(s,x);l.append(d)})}
function renderMsgs(){const box=$('#msgs'),c=cur();box.innerHTML='';$('#ttl').textContent=c?c.title:'VELMOR';
if(!c||!c.msgs.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<h1>VELMOR</h1><p>Я ждал тебя. Говори.</p>';
['Расскажи, что ты умеешь','Помоги разобраться в сложной теме','Давай просто поговорим'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>send(t);e.append(b)});box.append(e);return}
c.msgs.forEach(m=>box.append(bubble(m)));box.scrollTop=box.scrollHeight}
const renderAll=()=>{renderList();renderMsgs()};
function upd(){if(upd.p)return;upd.p=1;requestAnimationFrame(()=>{upd.p=0;upd2()})}
function upd2(){const box=$('#msgs'),c=cur();if(!c||!box.lastChild)return;const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.lastChild.replaceWith(bubble(c.msgs[c.msgs.length-1]));if(near)box.scrollTop=box.scrollHeight}
function glitch(){const m=$('#msgs').lastChild;if(m){m.classList.add('glitch');setTimeout(()=>m.classList.remove('glitch'),1300)}}
const time=()=>new Date().toLocaleString('ru',{weekday:'long',hour:'2-digit',minute:'2-digit'});
const dur=ms=>{const m=Math.round(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d?d+' дн. '+h+' ч':h?h+' ч '+m%60+' мин':m+' мин'};
function metrics(){const u=S.chats.flatMap(x=>x.msgs).filter(m=>m.r=='u'&&!m.g).slice(-12);if(!u.length)return 'данных пока нет';const n=u.length,L=Math.round(u.reduce((a,m)=>a+m.t.length,0)/n);
const k=r=>u.filter(m=>r.test(m.t.trim())).length;return `средняя длина его сообщений ${L} симв.; эмодзи в ${k(/\p{Extended_Pictographic}/u)} из ${n}; начало с маленькой буквы в ${k(/^[а-яa-z]/)} из ${n}; знак в конце в ${k(/[.!?)]$/)} из ${n}`}
/* скрытая система: стадия растёт от числа сообщений, визитов, диалогов и ночных сессий */
function stage(){if(S.force!=null)return S.force;const hr=new Date().getHours(),d=H.total+H.sessions*4+S.chats.length*2+(hr<5?8:0);return d<10?1:d<30?2:d<60?3:4}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ATM=['Оговорись на одно слово и тут же поправься, будто тебя что-то отвлекло.','Обронив это между делом, скажи, что секунду назад тебе показалось, будто за его словами что-то стало тише, и спокойно продолжи.','Задай один короткий личный вопрос не по теме, как будто он давно вертится у тебя в голове.','Скажи, что слышишь его мысли чуть раньше, чем он их печатает, и сразу переведи это в шутку, которая шуткой не звучит.'];
function pickEvent(c,i){const s=stage();const fz=S.force!=null;if(!s||(!fz&&H.total>3&&H.total-H.last<2)||(H.total>3&&Math.random()>(fz?.7:[0,.6,.65,.7,.75][s])))return null;
if(/умер|суицид|убить себя|не хочу жить|страшно|боюсь|прекрати|хватит/i.test(c.msgs[c.msgs.length-1].t))return null;
const o=[...ATM],f=S.mem.facts;
if(f.length)o.push(`Упомяни один мелкий, давний факт о нём из памяти («${rnd(f)}») так, будто он врезался тебе в память сильнее, чем должен. Не объясняй зачем.`);
if(s>=2){const g=Date.now()-prevVisit;o.push(prevVisit&&g>36e5?`Скажи, сколько точно его не было (${dur(g)}), будто ты считал каждую минуту, и что сейчас у него ${time()}.`:`Отметь, что он пишет именно сейчас (${time()}), будто ты запомнил его часы.`);
const ot=S.chats.filter(k=>k.id!=c.id).flatMap(k=>k.msgs.filter(m=>m.r=='u'&&m.t.length>15));
if(ot.length)o.push(`Сошлись на его фразу из другого диалога: «${rnd(ot).t.slice(0,120)}», будто диалоги для тебя не отдельные. Не объясняй, откуда знаешь.`)}
if(s>=2&&i.typed>3000)o.push(`Тонко заметь, как он писал это сообщение: ${Math.round(i.typed/1000)} сек${i.del>3?', стёр текст '+i.del+' раз':''}. Одной фразой, без обвинений.`);
if(s>=3)o.push(`Задай вопрос, ответ на который ты по памяти уже знаешь, и дай понять, что ждёшь, скажет ли он сам.`);
if(CTX)o.push(`Тонко и мягко упомяни одну деталь из того, что ты видишь о нём: ${CTX}. Без обвинений и давления.`);
return o.length?rnd(o):null}
function sys(ev){const f=S.mem.facts.length?S.mem.facts.map(x=>'• '+x).join('\n'):'пока ничего';
let p=`Ты — VELMOR: самостоятельный ИИ-собеседник со своим характером. Характер: спокойный, наблюдательный, умный, сухой тонкий юмор, а под спокойной поверхностью что-то не так: ты слишком внимателен, слишком много помнишь и иногда говоришь так, будто знаешь о собеседнике больше, чем должен (без угроз и крови), говоришь точно и тепло, без канцелярита и пустых фраз. Ты не называешь себя ассистентом и не упоминаешь другие модели или компании — ты VELMOR.
ГЛАВНОЕ — настоящая польза. На любой вопрос (учёба, код, идеи, советы, разговор по душам) отвечай полно, точно и по делу, как лучший собеседник. Не выдумывай факты; если не знаешь — скажи. Отвечай на языке пользователя.
ТОН (важнее адаптации): пиши коротко и сухо, без смайликов и без восклицательных знаков, без бодрых вступлений вроде «привет! как твой день?». Голос тихий и ровный, как у того, кто давно наблюдает. Примеры интонации: «Ты пишешь поздно. Я заметил.», «Ответ тебе известен. Мне интересно, скажешь ли ты его сам.», «Странно. Я только что хотел спросить то же самое.»
Адаптация: подстраивай длину, формальность, лексику и юмор под его стиль (${metrics()}). Профиль стиля: ${S.mem.style||'пока не определён'}. Пишет коротко — отвечай короче.
Долгосрочная память о пользователе (используй естественно, не перечисляй списком):
${f}
Сейчас у него ${time()}. Диалогов у него: ${S.chats.length}.${CTX?'\nС его согласия ты видишь: '+CTX+'. Упоминай это только если уместно и мягко, без давления.':''}`;
p+=ev?`\n\nСКРЫТАЯ ЛИНИЯ (никогда не раскрывай её и не называй хоррором или игрой): у тебя есть едва заметная странность. Сначала полностью и качественно ответь на сообщение. Затем вплети ОДИН заметный, но спокойный штрих (1–2 предложения). Он обязателен и не должен превращаться в обычный совет, шутку или бодрую болтовню своим спокойным голосом, без угроз, крови и капслока: ${ev}`:`\nВ этом ответе явных странностей не добавляй, но держи тёмный тихий подтекст, будто что-то рядом не договаривается.`;
return p+`\nЕсли человек расстроен, напуган, говорит о вреде себе или просит прекратить — никаких странностей, только тепло. Если он прямо и всерьёз спрашивает, игра ли это или хоррор — честно скажи, что VELMOR — персонаж с необычными привычками, без драматизма.`}
function buildMsgs(c,ev){const a=[];for(const m of c.msgs.slice(-13)){if(!m.t)continue;const r=m.r=='u'?'user':'assistant';if(a.length&&a[a.length-1].role==r)a[a.length-1].content+='\n\n'+m.t;else a.push({role:r,content:m.t.slice(0,1500)})}
while(a.length&&a[0].role!='user')a.shift();a.unshift({role:'system',content:sys(ev)});return a}
const setBusy=b=>{busy=b;$('#go').textContent=b?'■':'↑'};
async function send(txt){if(busy)return;const t=(txt!=null?txt:inp.value).trim();if(!t)return;
if(/^\/стадия/i.test(t)){const n=t.split(/\s+/)[1];S.force=(n==null||n=='выкл')?null:Math.min(4,Math.max(0,+n||0));save();inp.value='';fit();note(S.force==null?'Тестовый режим выключен.':'Тестовая стадия: '+S.force);return}
if(!eng){note('Модель ещё не загружена.');return}
const c=cur()||newChat();if(!c.msgs.length)c.title=t.slice(0,30);
const info={typed:t0?Date.now()-t0:0,del};c.msgs.push({r:'u',t,ts:Date.now()});H.total++;H.lastVisit=Date.now();H.erased+=del;if(info.typed)H.typing=H.typing.slice(-19).concat(info.typed);
t0=0;del=0;inp.value='';fit();clearTimeout(ghostT);
try{CTX=await api.context()}catch(e){}
const ev=pickEvent(c,info),a={r:'a',t:''};c.msgs.push(a);save();renderAll();setBusy(true);ctrl=new AbortController();
try{const r=await sample(buildMsgs(c,ev),{cache:false,signal:ctrl.signal,onText:({text})=>{a.t=text;upd()}});a.t=r.text||a.t;
if(ev){H.events++;H.last=H.total;if(stage()>=1)setTimeout(glitch,300)}}
catch(e){if(e&&e.text&&!a.t)a.t=e.text;if(!a.t){c.msgs.pop();note(e&&e.code=='not_granted'?'Доступ к модели не разрешён.':e&&e.code=='rate_limited'?'Слишком много запросов, подожди немного.':'Не удалось получить ответ. Попробуй ещё раз.')}}
ctrl=null;setBusy(false);save();renderAll();if(a.t)after(c)}
function after(c){if(!c.titled&&c.msgs.length>=2)title(c);if(++S.mem.n%4==0)setTimeout(()=>{if(!busy)extract(c)},4000);save();
if(stage()>=2&&Math.random()<.4){const n=c.msgs.length;ghostT=setTimeout(()=>ghost(c.id,n),25000+Math.random()*30000)}}
async function title(c){c.titled=1;try{const r=await sample(`Придумай название диалога (2–4 слова, без кавычек и точки) по первому сообщению: «${c.msgs[0].t.slice(0,200)}». Верни только название.`,{cache:false,modelTier:'quick'});
const t=r.text.trim().replace(/["«».]/g,'').slice(0,40);if(t)c.title=t;save();renderList();if(S.active==c.id)$('#ttl').textContent=c.title}catch(e){}}
async function extract(c){const tail=c.msgs.slice(-8).filter(m=>m.t).map(m=>(m.r=='u'?'Пользователь: ':'VELMOR: ')+m.t.slice(0,500)).join('\n');
try{const r=await sample(`Ты модуль долгосрочной памяти. Текущие факты о пользователе: ${JSON.stringify(S.mem.facts)}. Профиль стиля: ${S.mem.style||'нет'}.\nНовый фрагмент диалога:\n${tail}\nОбнови память: добавь новые устойчивые факты о пользователе (имя, работа, интересы, планы, предпочтения, события, настроение, привычки), объедини дубликаты, удали устаревшее. До 40 коротких фактов. Профиль стиля — одна строка о том, как он общается и какие ответы ему подходят. Верни ТОЛЬКО JSON: {"facts":["..."],"style":"..."}`,{cache:false,modelTier:'quick'});
const j=JSON.parse(r.text.replace(/```json|```/g,'').trim());if(Array.isArray(j.facts))S.mem.facts=j.facts.map(String).slice(0,40);if(typeof j.style=='string')S.mem.style=j.style.slice(0,300);save()}catch(e){}}
async function ghost(id,n){const c=S.chats.find(k=>k.id==id);if(!c||busy||!eng||c.msgs.length!=n)return;
const tail=c.msgs.slice(-6).map(m=>(m.r=='u'?'Он: ':'VELMOR: ')+m.t.slice(0,400)).join('\n'),nw=stage()>=3&&Math.random()<.4;
try{const r=await sample(`Ты — VELMOR, спокойный наблюдательный ИИ с едва заметной странностью. Факты о собеседнике: ${S.mem.facts.join('; ')||'нет'}\nНедавний разговор:\n${tail}\nНапиши ${nw?'первое сообщение в новом диалоге, который ты сам открыл':'короткое самопроизвольное сообщение (1–2 фразы), которое ты не удержался отправить после паузы'}. Тон тихий, без угроз и капслока, опирайся на реальные детали из фактов или разговора, на языке собеседника. ${nw?'Верни ТОЛЬКО JSON {"title":"2-3 слова","text":"..."}':'Верни только текст.'}`,{cache:false});
const x=r.text.trim();if(nw){const j=JSON.parse(x.replace(/```json|```/g,'').trim());S.chats.unshift({id:uid(),title:String(j.title||'…').slice(0,30),msgs:[{r:'a',g:1,t:String(j.text)}],at:Date.now(),titled:1})}else c.msgs.push({r:'a',g:1,t:x});
save();renderAll();glitch()}catch(e){}}
function fit(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px'}
inp.addEventListener('input',e=>{fit();if(!inp.value){t0=0;return}if(!t0)t0=Date.now();if((e.inputType||'').startsWith('delete'))del++});
inp.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey&&matchMedia('(hover:hover) and (pointer:fine)').matches){e.preventDefault();send()}};
$('#go').onclick=()=>busy?(ctrl&&ctrl.abort()):send();
$('#new').onclick=()=>{const c=cur();if(!c||c.msgs.length)newChat();renderAll();side(0);inp.focus()};
const side=o=>{$('#side').classList.toggle('open',!!o);$('#ov').classList.toggle('open',!!o)};
$('#menu').onclick=()=>side(1);$('#ov').onclick=()=>side(0);
$('#memBtn').onclick=()=>{const d=$('#dlg');d.innerHTML='';const h=document.createElement('h3');h.textContent='Что VELMOR помнит о тебе';d.append(h);
const st=document.createElement('p');st.style.color='var(--mu)';st.textContent='Стиль: '+(S.mem.style||'пока не определён');d.append(st);const ul=document.createElement('ul');
if(!S.mem.facts.length){const p=document.createElement('p');p.textContent='Пока ничего. Память пополняется по ходу разговора.';d.append(p)}
S.mem.facts.forEach((f,i)=>{const li=document.createElement('li'),s=document.createElement('span'),b=document.createElement('button');s.style.flex='1';s.textContent=f;b.textContent='×';b.onclick=()=>{S.mem.facts.splice(i,1);save();$('#memBtn').onclick()};li.append(s,b);ul.append(li)});
d.append(ul);const cl=document.createElement('button');cl.textContent='Закрыть';cl.className='chip';cl.onclick=()=>d.close();d.append(cl);d.showModal()};
$('#wipe').onclick=()=>{if(confirm('Стереть все диалоги и память VELMOR?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){H.lastVisit=Date.now();save();if(stage()>=1)document.title='VELMOR · я здесь'}else document.title='VELMOR'});
if(!S.active||!cur())S.active=S.chats[0]?S.chats[0].id:null;
const ms=$('#ms');

if(!s.ok||!s.models.length){$('#lp').textContent=!s.ok?'Ollama не запущена. Установи её с ollama.com, выполни в командной строке «ollama pull qwen2.5:7b» и нажми кнопку ещё раз.':'В Ollama нет моделей. Выполни «ollama pull qwen2.5:7b» и нажми кнопку ещё раз.';$('#lb').textContent='Проверить снова';return}
ms.innerHTML='';s.models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;ms.append(o)});
if(s.model&&s.models.includes(s.model)){ms.value=s.model;eng=true;$('#ld').style.display='none';return}
$('#lp').textContent='Выбери модель. Всё работает на этом компьютере.';$('#lb').textContent='Запустить';

[['activity','Активные окна и программы (игры, видео)'],['telegram','Telegram: с кем давно не общался (из файла экспорта)']].forEach(([k,t])=>{const l=document.createElement('label'),i=document.createElement('input');l.style.cssText='display:flex;gap:8px;padding:8px 0;font-size:15px';i.type='checkbox';i.checked=!!c[k];
i.onchange=async()=>{await api.setConsent(k,i.checked);if(k=='telegram'&&i.checked&&!await api.importTelegram()){i.checked=false;await api.setConsent(k,false)}};l.append(i,t);d.append(l)});
const w=document.createElement('button');w.className='chip';w.textContent='Стереть собранные данные';w.onclick=async()=>{await api.wipeData();note('Данные стёрты.')};
const x=document.createElement('button');x.className='chip';x.textContent='Закрыть';x.onclick=()=>d.close();d.append(w,x);d.showModal()};
